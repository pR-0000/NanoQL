name: Build unified NanoQL Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/bl616/nanoql_companion/**"
      - ".github/workflows/bl616-companion.yml"

permissions:
  contents: read

env:
  FPGA_COMPANION_COMMIT: a970a322627d881578d47e424a5b342496bb9d7b
  BOUFFALO_SDK_COMMIT: b51858d3fe5ffb587718167b8115c4188fb369de
  TOOLCHAIN_COMMIT: c4afe91cbd01bf7dce525e0d23b4219c8691e8f0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nano20k
            artifact: nanoql_companion_nano20k
            filename: nanoql_companion_nano20k.bin
          - board: nano20k_v3923
            artifact: nanoql_companion_nano20k_v3923
            filename: nanoql_companion_nano20k_v3923.bin

    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake make ninja-build

      - name: Fetch pinned FPGA Companion
        shell: bash
        run: |
          git init "$RUNNER_TEMP/fpga_companion"
          git -C "$RUNNER_TEMP/fpga_companion" remote add origin https://github.com/MiSTle-Dev/FPGA-Companion.git
          git -C "$RUNNER_TEMP/fpga_companion" fetch --depth 1 origin "$FPGA_COMPANION_COMMIT"
          git -C "$RUNNER_TEMP/fpga_companion" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/fpga_companion" submodule update --init --recursive --depth 1
          cp firmware/bl616/nanoql_companion/nanoql_drive.c "$RUNNER_TEMP/fpga_companion/src/bl616/"
          cp firmware/bl616/nanoql_companion/nanoql_drive.h "$RUNNER_TEMP/fpga_companion/src/bl616/"
          cp firmware/bl616/nanoql_companion/nanoql_flash.c "$RUNNER_TEMP/fpga_companion/src/bl616/"
          cp firmware/bl616/nanoql_companion/nanoql_flash.h "$RUNNER_TEMP/fpga_companion/src/bl616/"
          cp firmware/bl616/nanoql_companion/nanoql_usb.c "$RUNNER_TEMP/fpga_companion/src/bl616/"
          cp firmware/bl616/nanoql_companion/nanoql_usb.h "$RUNNER_TEMP/fpga_companion/src/bl616/"
          git -C "$RUNNER_TEMP/fpga_companion" apply "$GITHUB_WORKSPACE/firmware/bl616/nanoql_companion/fpga-companion.patch"

      - name: Fetch pinned Bouffalo SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/bouffalo_sdk"
          git -C "$RUNNER_TEMP/bouffalo_sdk" remote add origin https://github.com/MiSTle-Dev/bouffalo_sdk.git
          git -C "$RUNNER_TEMP/bouffalo_sdk" fetch --depth 1 origin "$BOUFFALO_SDK_COMMIT"
          git -C "$RUNNER_TEMP/bouffalo_sdk" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/bouffalo_sdk" submodule update --init --recursive --depth 1

      - name: Fetch pinned RISC-V toolchain
        shell: bash
        run: |
          git init "$RUNNER_TEMP/toolchain"
          git -C "$RUNNER_TEMP/toolchain" remote add origin https://github.com/bouffalolab/toolchain_gcc_t-head_linux.git
          git -C "$RUNNER_TEMP/toolchain" fetch --depth 1 origin "$TOOLCHAIN_COMMIT"
          git -C "$RUNNER_TEMP/toolchain" checkout --detach FETCH_HEAD

      - name: Build firmware
        shell: bash
        env:
          BL_SDK_BASE: ${{ runner.temp }}/bouffalo_sdk
        run: |
          export PATH="$RUNNER_TEMP/toolchain/bin:$PATH"
          make -C "$RUNNER_TEMP/fpga_companion/src/bl616" clean
          make -C "$RUNNER_TEMP/fpga_companion/src/bl616" TANG_BOARD=${{ matrix.board }}
          mkdir -p artifact
          cp "$RUNNER_TEMP/fpga_companion/src/bl616/build/build_out/fpga_companion_bl616.bin" "artifact/${{ matrix.filename }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.filename }}
          if-no-files-found: error

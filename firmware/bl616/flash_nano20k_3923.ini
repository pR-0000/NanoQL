[cfg]
# Normal revision-3923 setup: Partner selects programmer or Companion.
# 0: no erase, 1: programmed sections erase, 2: chip erase
erase = 1
skip_mode = 0x0, 0x0
boot2_isp_mode = 0
pre_program =
pre_program_args =

[official]
filedir = ./bl616_fpga_partner_nano20k_v3923.bin
address = 0x0

[custom]
filedir = ./fpga_companion_nano20k_v3923.bin
address = 0x40000
